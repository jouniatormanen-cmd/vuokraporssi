<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vuokrapörssi 0.5 testiversio</title>
<style>
:root{--bg:#07110d;--panel:#0d1b15;--panel2:#11251c;--line:#244235;--text:#f4fbf7;--muted:#9db4a8;--green:#43e38f;--green2:#19b96a;--danger:#c95050;--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 70% -10%,#174a32 0,transparent 32rem),var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:0;z-index:100;background:rgba(7,17,13,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07);padding:15px max(18px,5vw);display:flex;align-items:center;justify-content:space-between}
header b{font-size:25px;letter-spacing:-.8px}header b:before{content:"V";display:inline-grid;place-items:center;width:35px;height:35px;margin-right:10px;border-radius:11px;background:linear-gradient(135deg,var(--green),var(--green2));color:#062416;font-size:20px;box-shadow:0 0 30px rgba(67,227,143,.18)}
.hero{position:relative;overflow:hidden;padding:76px 18px 68px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}
.hero:before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;background:rgba(67,227,143,.10);filter:blur(90px);top:-290px;left:50%;transform:translateX(-50%)}
.hero h1{position:relative;margin:0 auto 14px;max-width:900px;font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-3.5px}.hero p{position:relative;margin:0;color:#bcd0c5;font-size:clamp(16px,2.4vw,20px)}
.hero h1:after{content:".";color:var(--green)}
main{max-width:1180px;margin:auto;padding:30px 18px 80px}.box,#detail{background:linear-gradient(145deg,rgba(17,37,28,.94),rgba(10,25,18,.96));border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:22px;box-shadow:0 18px 55px rgba(0,0,0,.20)}
.box h2,#detail h2{margin-top:0;font-size:clamp(23px,3vw,31px);letter-spacing:-.8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.full{grid-column:1/-1}
label{font-weight:700;font-size:13px;color:#c8d9d0}input,select,textarea{box-sizing:border-box;width:100%;padding:13px 14px;margin-top:6px;border:1px solid #2b493b;border-radius:12px;font:inherit;background:#08150f;color:var(--text);outline:none;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(67,227,143,.11)}textarea{min-height:115px;resize:vertical}
.btn{appearance:none;background:linear-gradient(135deg,var(--green),#27c979);color:#062416;border:0;border-radius:12px;padding:11px 17px;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 8px 22px rgba(31,201,112,.12)}.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}.btn:disabled{opacity:.55;cursor:wait}.light{background:#12291e;color:#d8eee2;border:1px solid #315541;box-shadow:none}.red{background:#552323;color:#ffdada;border:1px solid #7a3434;box-shadow:none}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{border:1px solid var(--line);border-radius:18px;padding:12px;background:#0a1811;overflow:hidden;transition:.22s}.card:hover{transform:translateY(-3px);border-color:#37634d;box-shadow:0 18px 40px rgba(0,0,0,.22)}.card h3{font-size:20px;margin:8px 0}.card p{color:#c4d4cb}.mainimg{display:block;width:calc(100% + 24px);max-width:none;margin:-12px -12px 13px;height:210px;object-fit:cover;background:#13231b}
.price{font-size:21px;font-weight:850;color:var(--green);margin-top:6px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
#detail{display:none;border-color:#315b46}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.calendar>b{text-align:center;color:#91aa9d;font-size:12px}.day{text-align:center;padding:8px 2px;border:1px solid #284637;border-radius:8px;font-size:13px}.free{background:#123d29;color:#d7f7e5}.busy{background:#1b201d;color:#67766e;text-decoration:line-through}
.blockcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:560px}.blockcal b{text-align:center;padding:5px;font-size:12px;color:#91aa9d}.blockcal button{border:1px solid #29483a;background:#0a1710;color:#e5f2eb;border-radius:8px;padding:9px 2px;cursor:pointer}.blockcal button:hover{background:#163626}.blockcal button.selected{background:#6a3030;color:#fff;border-color:#a34a4a;text-decoration:line-through}.blockcal button.range-start{outline:3px solid #c7993f}
.upload-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:10px}.upload-item{position:relative;border:1px solid #29483a;border-radius:12px;padding:6px;background:#091710}.upload-item img{display:block;width:100%;height:100px;object-fit:cover;border-radius:8px}.upload-item.main{border:2px solid var(--green)}.upload-badge{position:absolute;left:10px;top:10px;background:var(--green);color:#062416;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:bold}.upload-tools{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.upload-tools button{font-size:11px;padding:6px 7px}
.gallery-main-wrap{position:relative;margin:16px 0 10px;background:#050c08;border-radius:16px;overflow:hidden;min-height:240px;display:flex;align-items:center;justify-content:center}.gallery-main{display:block;max-width:100%;max-height:650px;width:auto;height:auto;cursor:zoom-in}.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(7,17,13,.82);color:#fff;font-size:24px;cursor:pointer}.gallery-prev{left:10px}.gallery-next{right:10px}.gallery-count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:5px 9px;font-size:13px}.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 8px}.gallery-thumb{flex:0 0 86px;height:66px;border:2px solid transparent;border-radius:9px;padding:0;background:#08150f;cursor:pointer;overflow:hidden}.gallery-thumb.active{border-color:var(--green)}.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{display:none;position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain}.lightbox-close{position:absolute;right:18px;top:16px;border:0;background:transparent;color:#fff;font-size:38px;cursor:pointer}.lightbox .gallery-arrow{position:fixed}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){header{padding:12px 15px}header b{font-size:20px}header b:before{width:31px;height:31px;font-size:17px}.hero{padding:48px 18px 42px}.hero h1{font-size:43px;letter-spacing:-2.2px}.hero p{font-size:15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:18px 12px 60px}.box,#detail{padding:17px;border-radius:16px}.cards{grid-template-columns:1fr}.mainimg{height:220px}.gallery-main-wrap{min-height:180px}.gallery-main{max-height:430px}.gallery-arrow{width:38px;height:38px}.upload-gallery{grid-template-columns:repeat(2,1fr)}.calendar{gap:3px}.day{padding:7px 1px;font-size:12px}.btn{min-height:44px}}
</style>
</head>
<body>
<header><b>Vuokrapörssi</b></header>
<section class="hero"><h1>Vuokraa tarvitsemasi<br>Laita omasi vuokralle</h1><p>Yksi paikka tavaroille, ajoneuvoille, tiloille ja välineille.</p></section>
<main>
<div class="box"><h2>Hae ilmoituksia</h2><div class="grid">
<label>Hakusana<input id="search" placeholder="Mitä etsit?"></label><label>Paikkakunta<input id="cityFilter" placeholder="Esim. Helsinki"></label><label>Kategoria<select id="catFilter"><option value="">Kaikki kategoriat</option></select></label><label>Järjestä<select id="sort"><option value="new">Uusimmat</option><option value="cheap">Halvin ensin</option><option value="expensive">Kallein ensin</option></select></label>
</div></div>
<div id="detail"></div>
<div class="box"><h2>Jätä ilmoitus</h2><form id="form"><div id="editStatus" style="display:none"></div><div class="grid">
<label>Otsikko *<input name="title" required></label><label>Kategoria *<select name="category" id="formCat" required><option value="">Valitse</option></select></label><label>Paikkakunta *<input name="city" required></label><label>Postinumero<input name="postal" maxlength="5"></label><label>Hinta (€) *<input name="price" type="number" min="0" step="0.01" required></label><label>Hinnoittelu<select name="period"><option value="päivä">€/päivä</option><option value="viikko">€/viikko</option><option value="kuukausi">€/kuukausi</option></select></label><label>Saatavilla alkaen<input name="from" type="date"></label><label>Saatavilla asti<input name="to" type="date"></label>
<label class="full">Varatut päivät<div class="muted" style="margin:5px 0 8px">Valitse varauksen <b>alkupäivä</b> ja <b>loppupäivä</b> kalenterista.</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div style="flex:1;min-width:180px"><b>Alkupäivä</b><div id="rangeStartLabel" class="muted">Ei valittu</div></div><div style="flex:1;min-width:180px"><b>Loppupäivä</b><div id="rangeEndLabel" class="muted">Ei valittu</div></div></div><div id="blockedCalendar"></div><div style="margin-top:8px"><button class="btn light" id="clearBlocked" type="button">Tyhjennä varatut päivät</button></div><input name="blocked" id="blockedHidden" type="hidden"></label>
<label class="full">Kuvaus *<textarea name="description" required></textarea></label><label>Yhteyshenkilö *<input name="contactName" required></label><label>Puhelinnumero tai sähköpostiosoite *<input name="contact" required autocomplete="off" placeholder="Esim. 040 123 4567 tai nimi@example.fi"></label>
<label class="full">Kuvat (enintään 10)<input id="imageInput" name="images" type="file" accept="image/*" multiple><span class="muted">Voit valita useita kuvia kerralla. Ensimmäinen kuva on pääkuva. Voit vaihtaa pääkuvaa tai poistaa kuvia ennen tallennusta.</span><div id="imageCount" class="muted" style="margin-top:8px">0 / 10 kuvaa</div><div id="imagePreview" class="upload-gallery"></div></label>
</div><p><button class="btn" id="saveBtn" type="button">Lisää ilmoitus</button><button class="btn light" id="cancelEdit" type="button" style="display:none;margin-left:8px">Peruuta muokkaus</button></p><p id="msg"></p></form></div>
<div class="box"><h2>Ilmoitukset</h2><p id="count"></p><div id="cards" class="cards"></div></div>
</main>
<div id="lightbox" class="lightbox" aria-hidden="true"><button type="button" class="lightbox-close" onclick="closeLightbox()" aria-label="Sulje">×</button><button type="button" class="gallery-arrow gallery-prev" onclick="galleryStep(-1)" aria-label="Edellinen kuva">‹</button><img id="lightboxImage" alt="Suurennettu kuva"><button type="button" class="gallery-arrow gallery-next" onclick="galleryStep(1)" aria-label="Seuraava kuva">›</button></div>
<script>
var categories=['Asunnot ja majoitus','Autot ja muut ajoneuvot','Peräkärryt ja kuljetus','Työkalut ja koneet','Urheilu ja harrastukset','Juhlat ja tapahtumat','Tilat ja varastot','Muut tavarat ja palvelut'];
var SUPABASE_URL='https://txairhtwoxwxlvppfjkn.supabase.co',SUPABASE_KEY='sb_publishable_yByUkSb2MVT51pfEVgBy4w_ylYydw0q';
var listings=[],loadingListings=false,savingListing=false;
function el(id){return document.getElementById(id)}
for(var i=0;i<categories.length;i++){var a=document.createElement('option');a.value=categories[i];a.textContent=categories[i];el('catFilter').appendChild(a);var b=document.createElement('option');b.value=categories[i];b.textContent=categories[i];el('formCat').appendChild(b)}
function apiHeaders(extra){var h={'apikey':SUPABASE_KEY};if(extra)for(var k in extra)h[k]=extra[k];return h}
function dbToUi(r){return{id:r.id,title:r.title||'',category:r.category||'',description:r.description||'',price:Number(r.price||0),city:r.city||'',postal:r.postal_code||'',period:r.price_unit||'päivä',from:r.available_from||'',to:r.available_to||'',blocked:Array.isArray(r.reserved_dates)?r.reserved_dates:[],images:Array.isArray(r.images)?r.images:[],mainImage:(Array.isArray(r.images)&&r.images.length?r.images[0]:''),contactName:r.contact_name||'',contact:r.contact_email||r.contact_phone||'',created_at:r.created_at||''}}
async function loadListings(){loadingListings=true;el('count').textContent='Ladataan ilmoituksia…';try{var res=await fetch(SUPABASE_URL+'/rest/v1/listings?select=*&order=created_at.desc',{headers:apiHeaders()});if(!res.ok)throw new Error('Tietokantavirhe '+res.status+': '+await res.text());var rows=await res.json();listings=rows.map(dbToUi);render()}catch(err){console.error(err);listings=[];render();el('count').textContent='Ilmoitusten lataaminen ei onnistunut: '+esc(err.message)}finally{loadingListings=false}}
async function uploadDataUrl(dataUrl,index){var parts=dataUrl.split(','),meta=parts[0]||'',mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/jpeg';var bin=atob(parts[1]||''),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var ext=mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg',name=Date.now()+'-'+Math.random().toString(36).slice(2,10)+'-'+index+'.'+ext,path='listings/'+name;var res=await fetch(SUPABASE_URL+'/storage/v1/object/listing-images/'+path,{method:'POST',headers:apiHeaders({'Content-Type':mime,'x-upsert':'false'}),body:new Blob([bytes],{type:mime})});if(!res.ok)throw new Error('Kuvan lataus epäonnistui ('+res.status+'): '+await res.text());return SUPABASE_URL+'/storage/v1/object/public/listing-images/'+path}
async function uploadGalleryImages(){var urls=[];for(var i=0;i<galleryImages.length;i++){var v=galleryImages[i];if(/^data:/i.test(v))urls.push(await uploadDataUrl(v,i));else urls.push(v)}return urls}
function esc(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
var galleryImages=[];
function cropAndCompress(file,done){var r=new FileReader();r.onload=function(ev){var img=new Image();img.onload=function(){try{var sw=Math.min(img.width,600),sh=Math.max(1,Math.round(img.height*(sw/img.width))),scan=document.createElement('canvas');scan.width=sw;scan.height=sh;var sx=scan.getContext('2d');sx.drawImage(img,0,0,sw,sh);var data=sx.getImageData(0,0,sw,sh).data;function darkRow(y){var dark=0,total=0,step=Math.max(1,Math.floor(sw/120));for(var xx=0;xx<sw;xx+=step){var q=(y*sw+xx)*4;if(data[q]<35&&data[q+1]<35&&data[q+2]<35)dark++;total++}return total&&dark/total>0.92}var top=0,bottom=sh-1;while(top<sh*.35&&darkRow(top))top++;while(bottom>sh*.65&&darkRow(bottom))bottom--;var sourceTop=Math.round(top*(img.height/sh)),sourceBottom=Math.round((bottom+1)*(img.height/sh)),sourceH=Math.max(1,sourceBottom-sourceTop),max=700,scale=Math.min(1,max/Math.max(img.width,sourceH)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(sourceH*scale));c.getContext('2d').drawImage(img,0,sourceTop,img.width,sourceH,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.70))}catch(err){done('')}};img.onerror=function(){done('')};img.src=ev.target.result};r.onerror=function(){done('')};r.readAsDataURL(file)}
function renderUploadGallery(){el('imageCount').textContent=galleryImages.length+' / 10 kuvaa';var h='';for(var i=0;i<galleryImages.length;i++)h+='<div class="upload-item '+(i===0?'main':'')+'"><img src="'+galleryImages[i]+'" alt="Kuva '+(i+1)+'">'+(i===0?'<span class="upload-badge">Pääkuva</span>':'')+'<div class="upload-tools">'+(i!==0?'<button type="button" class="btn light" onclick="setMainImage('+i+')">Pääkuvaksi</button>':'')+(i>0?'<button type="button" class="btn light" onclick="moveUploadImage('+i+',-1)">←</button>':'')+(i<galleryImages.length-1?'<button type="button" class="btn light" onclick="moveUploadImage('+i+',1)">→</button>':'')+'<button type="button" class="btn red" onclick="removeUploadImage('+i+')">Poista</button></div></div>';el('imagePreview').innerHTML=h}
function setMainImage(i){if(i<1||i>=galleryImages.length)return;var x=galleryImages.splice(i,1)[0];galleryImages.unshift(x);renderUploadGallery()}function moveUploadImage(i,dir){var j=i+dir;if(j<0||j>=galleryImages.length)return;var x=galleryImages[i];galleryImages[i]=galleryImages[j];galleryImages[j]=x;renderUploadGallery()}function removeUploadImage(i){galleryImages.splice(i,1);renderUploadGallery()}
el('imageInput').onchange=function(){var files=Array.prototype.slice.call(this.files||[]),room=10-galleryImages.length;if(files.length>room){el('msg').textContent='Voit lisätä enintään 10 kuvaa. Valitse vielä enintään '+room+' kuvaa.';this.value='';return}if(!files.length)return;el('msg').textContent='Kuvia käsitellään...';var done=0,added=[];for(var i=0;i<files.length;i++)(function(file,pos){cropAndCompress(file,function(data){if(data)added[pos]=data;done++;if(done===files.length){for(var j=0;j<added.length;j++)if(added[j])galleryImages.push(added[j]);renderUploadGallery();el('msg').textContent=galleryImages.length?'Kuvat lisätty.':'Kuvien käsittely epäonnistui.';el('imageInput').value=''}})})(files[i],i)};
function render(){var q=el('search').value.toLowerCase(),c=el('cityFilter').value.toLowerCase(),cat=el('catFilter').value,arr=[];for(var i=0;i<listings.length;i++){var x=listings[i],hay=(x.title+' '+x.description+' '+x.city+' '+x.category).toLowerCase();if((!q||hay.indexOf(q)>=0)&&(!c||x.city.toLowerCase().indexOf(c)>=0)&&(!cat||x.category==cat))arr.push({x:x,index:i})}if(el('sort').value=='cheap')arr.sort(function(a,b){return a.x.price-b.x.price});if(el('sort').value=='expensive')arr.sort(function(a,b){return b.x.price-a.x.price});el('count').textContent='Ilmoituksia: '+arr.length;var out='';for(var j=0;j<arr.length;j++){var x=arr[j].x,k=arr[j].index;out+='<div class="card">'+((x.images&&x.images.length)?'<img class="mainimg" src="'+x.images[0]+'" alt="'+esc(x.title)+'">':'')+'<div class="muted">'+esc(x.category)+'</div><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.city)+(x.postal?' · '+esc(x.postal):'')+'</div><div class="price">'+Number(x.price).toLocaleString('fi-FI')+' € / '+esc(x.period)+'</div><p>'+esc(x.description)+'</p><div class="actions"><button class="btn" onclick="showDetail('+k+')">Katso ilmoitus</button></div></div>'}el('cards').innerHTML=out||'<p>Ei vielä ilmoituksia.</p>'}
var activeDetail=-1,galleryIndex=0;function getImages(x){return x.images&&x.images.length?x.images:[]}
function galleryHtml(x){var imgs=getImages(x);if(!imgs.length)return '';var h='<div class="gallery-main-wrap"><img id="galleryMain" class="gallery-main" src="'+imgs[0]+'" alt="'+esc(x.title)+'" onclick="openLightbox()">';if(imgs.length>1)h+='<button type="button" class="gallery-arrow gallery-prev" onclick="galleryStep(-1)">‹</button><button type="button" class="gallery-arrow gallery-next" onclick="galleryStep(1)">›</button>';h+='<span id="galleryCount" class="gallery-count">1 / '+imgs.length+'</span></div>';if(imgs.length>1){h+='<div class="gallery-thumbs">';for(var j=0;j<imgs.length;j++)h+='<button type="button" class="gallery-thumb '+(j===0?'active':'')+'" onclick="gallerySelect('+j+')"><img src="'+imgs[j]+'" alt=""></button>';h+='</div>'}return h}
function showDetail(k){var x=listings[k],d=el('detail');activeDetail=k;galleryIndex=0;d.innerHTML='<button class="btn light" onclick="closeDetail()">Sulje</button><h2>'+esc(x.title)+'</h2>'+galleryHtml(x)+'<p class="muted">'+esc(x.category)+' · '+esc(x.city)+(x.postal?' · '+esc(x.postal):'')+'</p><div class="price">'+Number(x.price).toLocaleString('fi-FI')+' € / '+esc(x.period)+'</div><h3>Kuvaus</h3><p>'+esc(x.description)+'</p><h3>Saatavuus</h3><p>'+(x.from?'Alkaen '+esc(x.from):'')+(x.from&&x.to?' – ':'')+(x.to?'asti '+esc(x.to):'')+(!x.from&&!x.to?'Ei rajattua saatavuusaikaa.':'')+'</p><div id="cal-'+k+'">'+makeCalendar(x,k)+'</div><h3>Yhteystiedot</h3><p>'+esc(x.contactName)+' · '+esc(x.contact)+'</p>';d.style.display='block';d.scrollIntoView()}
function gallerySelect(i){if(activeDetail<0)return;var imgs=getImages(listings[activeDetail]);if(!imgs.length)return;galleryIndex=(i+imgs.length)%imgs.length;var main=el('galleryMain');if(main)main.src=imgs[galleryIndex];var count=el('galleryCount');if(count)count.textContent=(galleryIndex+1)+' / '+imgs.length;var thumbs=document.querySelectorAll('.gallery-thumb');for(var j=0;j<thumbs.length;j++)thumbs[j].className='gallery-thumb '+(j===galleryIndex?'active':'');if(el('lightbox').className.indexOf('open')>=0)el('lightboxImage').src=imgs[galleryIndex]}
function galleryStep(dir){if(activeDetail<0)return;gallerySelect(galleryIndex+dir)}function openLightbox(){if(activeDetail<0)return;var imgs=getImages(listings[activeDetail]);if(!imgs.length)return;el('lightboxImage').src=imgs[galleryIndex];el('lightbox').className='lightbox open';el('lightbox').setAttribute('aria-hidden','false')}function closeLightbox(){el('lightbox').className='lightbox';el('lightbox').setAttribute('aria-hidden','true')}function closeDetail(){closeLightbox();el('detail').style.display='none';activeDetail=-1}
