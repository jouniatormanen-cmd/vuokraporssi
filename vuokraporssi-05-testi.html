<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vuokrapörssi – Supabase-yhteystesti</title>
</head>
<body>
<h1>Vuokrapörssi – Supabase-yhteystesti</h1>
<p id="tulos">Testataan yhteyttä...</p>

<script>
const url = "https://txairhtwoxwxlvppfjkn.supabase.co/rest/v1/listings?select=id&limit=1";
const key = "sb_publishable_yByUkSb2MVT51pfEVgBy4w_ylYydw0q";

fetch(url, {
  headers: {
    "apikey": key
  }
})
.then(async response => {
  const text = await response.text();

  if (!response.ok) {
    throw new Error("HTTP " + response.status + " – " + text);
  }

  document.getElementById("tulos").innerHTML =
    "<strong>YHTEYS TOIMII ✅</strong><br>Supabase vastasi onnistuneesti.";
})
.catch(error => {
  document.getElementById("tulos").innerHTML =
    "<strong>YHTEYS EI TOIMI ❌</strong><br>" + error.message;
});
</script>
</body>
</html>
