<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vuokrapörssi – kielitesti</title>
<style>html,body{margin:0;height:100%;font-family:system-ui;background:#07110d;color:white}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;background:#10291d}select{font:inherit;padding:8px;border-radius:8px;background:#fff;color:#10291d}iframe{display:block;width:100%;height:calc(100% - 54px);border:0}small{font-size:12px}</style></head>
<body><header><small>Vuokrapörssi · kieliversion testi</small><label>Kieli / Language / Språk <select id="language"><option value="fi">FI</option><option value="en">EN</option><option value="sv">SV</option></select></label></header><iframe id="site" title="Vuokrapörssi" src="../index.html"></iframe>
<script src="translations.js"></script><script>
const frame=document.getElementById('site'),picker=document.getElementById('language');
let current=localStorage.getItem('vp-language')||'fi';if(!['fi','en','sv'].includes(current))current='fi';picker.value=current;
const originals=new WeakMap();
const labels={'Etusivu':'home','Selaa tarjontaa':'browse','Vuokraustoiveet':'wanted','Jätä ilmoitus':'create','Oma Vuokrapörssi':'account','Kirjaudu ulos':'logout','Etsi vuokrattavaa':'search'};
function translate(){const doc=frame.contentDocument;if(!doc||!doc.body)return;doc.documentElement.lang=current;
 const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;if(n.parentElement&&n.parentElement.closest('script,style,svg,textarea'))continue;const value=n.textContent.trim();if(!value)continue;const original=originals.get(n)||value;const key=labels[original];if(!key)continue;originals.set(n,original);n.textContent=window.VP_TRANSLATIONS[current][key];}
}
picker.addEventListener('change',()=>{current=picker.value;localStorage.setItem('vp-language',current);translate()});
frame.addEventListener('load',()=>{translate();const observer=new MutationObserver(()=>{observer.disconnect();translate();observer.observe(frame.contentDocument.body,{childList:true,subtree:true})});observer.observe(frame.contentDocument.body,{childList:true,subtree:true})});
</script></body></html>
